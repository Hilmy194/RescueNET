# Konfigurasi Mosquitto untuk RescueNet (broker MQTT lokal, tanpa internet)
# Simpan sebagai /etc/mosquitto/conf.d/rescuenet.conf di Raspberry Pi

listener 1883 0.0.0.0
allow_anonymous true

# Catatan keamanan (opsional untuk Desain Proyek 2):
# Untuk deployment nyata, aktifkan otentikasi dengan:
#   allow_anonymous false
#   password_file /etc/mosquitto/rescuenet_passwd
# lalu buat user dengan: mosquitto_passwd -c /etc/mosquitto/rescuenet_passwd admin
